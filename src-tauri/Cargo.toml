[package]
name = "xinyu"
version = "2.0.0"
description = "心屿 · 大学生情绪陪伴智能体"
authors = ["心屿"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xinyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
